/* HOMEPAGE AI CHAT CONSOLE (SLEEK CHATGPT STYLE) */
.home-chat {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: min(680px, calc(100vw - 32px));
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(168, 111, 69, 0.28);
  border-radius: 9999px;
  padding: 6px 8px 6px 14px;
  box-shadow: 0 12px 36px rgba(48, 37, 31, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
  z-index: 25;
  transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-radius 0.3s ease, max-height 0.35s ease, box-shadow 0.3s ease;
}

/* Expanded state when suggestions or chat log are visible */
.home-chat.sug-open,
.home-chat.has-msgs {
  border-radius: 20px;
  padding: 12px 14px;
}

/* Scroll disappear: hide cleanly when user scrolls down */
.home-chat.hchat-hidden {
  opacity: 0 !important;
  pointer-events: none !important;
  transform: translate(-50%, 24px) scale(0.96) !important;
}

/* Messages Log */
.home-chat .log {
  max-height: 0;
  overflow-y: auto;
  opacity: 0;
  transition: max-height 0.35s ease, opacity 0.3s ease, margin-bottom 0.3s ease;
}
.home-chat.has-msgs .log {
  max-height: 220px;
  opacity: 1;
  margin-bottom: 10px;
  padding-right: 4px;
  border-bottom: 1px solid rgba(168, 111, 69, 0.15);
  padding-bottom: 8px;
}

/* Input row */
.home-chat .in {
  display: flex;
  gap: 8px;
  align-items: center;
}
.home-chat .ai-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--terra);
  box-shadow: 0 0 6px rgba(185, 109, 80, 0.5);
  flex-shrink: 0;
}
.home-chat select.mode-sel {
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid rgba(168, 111, 69, 0.3);
  background: rgba(242, 233, 218, 0.6);
  font-size: 11px;
  font-family: var(--sans);
  font-weight: 500;
  color: var(--esp);
  cursor: pointer;
  outline: none;
  transition: all 0.2s;
  flex-shrink: 0;
}
.home-chat select.mode-sel:hover {
  background: rgba(242, 233, 218, 0.95);
  border-color: var(--cop);
}
.home-chat input.chat-input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font-size: 13px;
  font-family: var(--sans);
  color: var(--esp);
  padding: 4px 6px;
}
.home-chat input.chat-input::placeholder {
  color: rgba(67, 58, 50, 0.55);
}

/* Action buttons */
.home-chat .btn-icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--char);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.home-chat .btn-icon:hover {
  background: rgba(168, 111, 69, 0.12);
  color: var(--esp);
}
.home-chat .btn-expand {
  font-size: 12px;
  transition: transform 0.3s ease;
}
.home-chat.sug-open .btn-expand {
  transform: rotate(180deg);
}

/* Send button (ChatGPT style circular arrow) */
.home-chat .btn-send {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: var(--terra);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.home-chat .btn-send:hover {
  transform: scale(1.06);
  box-shadow: 0 4px 12px rgba(185, 109, 80, 0.35);
}
.home-chat .btn-send svg {
  width: 14px;
  height: 14px;
  stroke-width: 2.5;
}

/* Tray containing pre-queries and scope info */
.home-chat .tray {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.3s ease;
}
.home-chat.sug-open .tray {
  max-height: 180px;
  opacity: 1;
  pointer-events: auto;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(168, 111, 69, 0.15);
}
.home-chat .tray .scope-info {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--char);
  opacity: 0.7;
  margin-bottom: 6px;
}
.home-chat .tray .sug {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.home-chat .tray .sug button {
  border: 1px solid rgba(168, 111, 69, 0.35);
  background: rgba(242, 233, 218, 0.55);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 11px;
  color: var(--esp);
  cursor: pointer;
  transition: all 0.2s;
}
.home-chat .tray .sug button:hover {
  background: var(--terra);
  color: #fff;
  border-color: var(--terra);
}
.home-chat .ev2 {
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px;
  border: 1px solid var(--cop);
  background: transparent;
  border-radius: 6px;
  padding: 2px 7px;
  margin: 2px 3px;
  cursor: pointer;
  font-weight: 600;
  color: var(--esp);
}
.home-chat .ev2:hover {
  background: var(--terra);
  color: #fff;
}

@media(max-width: 800px) {
  .home-chat {
    width: calc(100vw - 20px);
    bottom: 12px;
    padding: 6px 8px;
  }
  .home-chat select.mode-sel {
    font-size: 10px;
    padding: 4px 6px;
  }
}

.scroll{flex:1;min-height:0;overflow:auto;position:relative;margin:8px 0;padding-left:22px;border-top:1px solid var(--line)}
.scroll:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--cop)}
.ev{display:flex;gap:10px;align-items:center;position:relative;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .3s;top:auto!important;font-family:var(--sans)!important;font-size:14px!important;letter-spacing:normal!important;line-height:1.4!important}
.ev:before{content:"";position:absolute;left:-18px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--c,var(--terra));border:2px solid var(--card)}
.ev b{font-weight:600;font-family:var(--sans)!important;font-size:14px!important;letter-spacing:normal!important}
.ev.hl,.ev.active{background:rgba(198,154,85,.3)!important;border-radius:6px;top:auto!important;font-family:var(--sans)!important;letter-spacing:normal!important}
.ev:hover{background:rgba(185,109,80,.1)}
.mp{font-size:10px;font-weight:600;letter-spacing:.06em;border-radius:99px;padding:3px 9px;background:color-mix(in srgb,var(--c) 25%,transparent);flex:none}
.t-FIR{--c:#c0504a}.t-Comm{--c:#4a7fb5}.t-Loc{--c:var(--olive)}.t-Fin{--c:var(--terra)}.t-Cross{--c:#8a63b0}
.ctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ctl button,.ctl select{padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:12px}
.ctl .on{background:var(--terra);color:#fff;border-color:var(--terra)}
.chat{border:1.5px solid var(--cop);border-radius:12px;background:var(--ivo);padding:10px;position:relative;z-index:10;box-shadow:0 4px 14px rgba(48,37,31,0.06)}
.chat .log{max-height:0;overflow:auto;transition:max-height .3s}.chat.open .log{max-height:220px;margin-bottom:8px}
.chat .in{display:flex;gap:6px;align-items:center;position:relative;z-index:12}
.chat input#q{
  background:#FFFFFF !important;
  color:#30251F !important;
  border:2px solid var(--cop) !important;
  border-radius:8px !important;
  padding:8px 12px !important;
  font-size:13px !important;
  font-family:var(--sans) !important;
  outline:2px solid transparent !important;
  position:relative !important;
  z-index:100 !important;
  pointer-events:auto !important;
  user-select:text !important;
  -webkit-user-select:text !important;
  cursor:text !important;
  box-shadow:0 1px 4px rgba(48,37,31,0.08) !important;
  width:100% !important;
  min-width:120px !important;
}
.chat input#q:focus{
  border-color:var(--terra) !important;
  outline:2px solid var(--terra) !important;
  box-shadow:0 0 0 4px rgba(185,109,80,0.3) !important;
}
body[data-v="p"] .copilot-btn {
  bottom: 12px !important;
  right: 18px !important;
  transform: scale(0.92);
  z-index: 1000 !important;
}
.chat button#send{
  position:relative;
  z-index:20;
  pointer-events:auto;
}
.msg{margin:6px 0;font-size:13px;line-height:1.45}.msg.u{text-align:right;color:var(--cop)}
.msg .ev2{font-family:var(--mono);font-size:11px;border:1px solid var(--cop);background:transparent;border-radius:6px;padding:0 5px;margin:0 2px}
.msg .lab{font-size:10px;letter-spacing:.1em;color:var(--terra)}
.in{display:flex;gap:6px;align-items:center}.ai{font-family:var(--serif);letter-spacing:.15em;font-size:13px;white-space:nowrap}
.sug{font-size:11px;margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}.sug button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 8px;font-size:11px}
.dr{position:fixed;right:0;top:0;bottom:0;width:min(360px,100%);background:var(--card);border-left:1px solid var(--cop);padding:24px;transform:translateX(105%);transition:transform .35s;z-index:30;box-shadow:-10px 0 30px rgba(48,37,31,.2);overflow-y:auto}
.dr.open{transform:none}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--esp);color:var(--ivo);padding:8px 16px;border-radius:99px;z-index:40;font-size:12px}
@media(max-width:800px){.prof{grid-template-columns:1fr;overflow:auto;height:auto}.dos{min-height:480px}.tl{height:90vh}}

/* UNIVERSAL KRONOS INVESTIGATION COPILOT */
.copilot-btn {
  position: fixed;
  bottom: 24px;
  right: 28px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 9px;
  background: rgba(248, 243, 233, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--cop);
  border-radius: 999px;
  padding: 8px 16px 8px 12px;
  box-shadow: 0 10px 28px rgba(48, 37, 31, 0.24), 0 2px 6px rgba(0, 0, 0, 0.05);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  font-family: var(--sans);
  color: var(--esp);
}
.copilot-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 34px rgba(48, 37, 31, 0.32);
  border-color: var(--terra);
}
.copilot-btn .c-orb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #E5A866, var(--terra));
  box-shadow: 0 0 10px rgba(185, 109, 80, 0.7);
  animation: pulse-orb 2.2s ease-in-out infinite;
}
@keyframes pulse-orb {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.25); opacity: 0.85; filter: drop-shadow(0 0 6px #C69A55); }
}
.copilot-btn .c-label {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.06em;
}
.copilot-btn .c-kbd {
  font-family: var(--mono);
  font-size: 10px;
  background: rgba(168, 111, 69, 0.15);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid rgba(168, 111, 69, 0.3);
  color: var(--char);
}

/* Copilot Floating Window */
.copilot-panel {
  position: fixed;
  bottom: 80px;
  right: 28px;
  width: 440px;
  max-width: calc(100vw - 32px);
  height: 620px;
  max-height: calc(100vh - 110px);
  background: rgba(248, 243, 233, 0.98);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--cop);
  border-radius: 18px;
  box-shadow: 0 24px 64px rgba(48, 37, 31, 0.35), 0 4px 16px rgba(0, 0, 0, 0.06);
  z-index: 1001;
  display: none;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px) scale(0.96);
  transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.copilot-panel.open {
  display: flex !important;
  opacity: 1 !important;
  pointer-events: auto !important;
  transform: translateY(0) scale(1) !important;
}
.copilot-panel.maximized {
  width: min(840px, calc(100vw - 32px));
  height: min(820px, calc(100vh - 90px));
}

/* Header */
.c-head {
  padding: 12px 16px;
  background: linear-gradient(180deg, rgba(220, 202, 176, 0.35), transparent);
  border-bottom: 1px solid rgba(168, 111, 69, 0.22);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.c-head-title {
  display: flex;
  align-items: center;
  gap: 8px;
}
.c-head-title h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--esp);
}
.c-status-tag {
  font-family: var(--mono);
  font-size: 9px;
  background: rgba(123, 128, 98, 0.2);
  color: var(--olive);
  border: 1px solid rgba(123, 128, 98, 0.4);
  padding: 2px 6px;
  border-radius: 999px;
  font-weight: 600;
}
.c-head-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Language selector pills */
.c-lang-group {
  display: flex;
  background: rgba(220, 202, 176, 0.4);
  padding: 2px;
  border-radius: 999px;
  border: 1px solid rgba(168, 111, 69, 0.3);
}
.c-lang-btn {
  background: transparent;
  border: none;
  font-size: 10px;
  font-family: var(--sans);
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  color: var(--char);
  cursor: pointer;
  transition: all 0.2s;
}
.c-lang-btn.on {
  background: var(--terra);
  color: #fff;
  box-shadow: 0 1px 4px rgba(185, 109, 80, 0.4);
}

.c-btn-icon {
  background: none;
  border: none;
  font-size: 14px;
  color: var(--char);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.c-btn-icon:hover {
  background: rgba(168, 111, 69, 0.15);
  color: var(--esp);
}

/* Context Banner */
.c-context-banner {
  padding: 6px 14px;
  background: rgba(242, 233, 218, 0.7);
  border-bottom: 1px solid rgba(168, 111, 69, 0.12);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--char);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.c-context-banner span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Message Stream */
.c-stream {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.c-msg {
  display: flex;
  flex-direction: column;
  max-width: 92%;
  animation: c-fade-in 0.25s ease;
}
@keyframes c-fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.c-msg.user {
  align-self: flex-end;
  background: var(--esp);
  color: var(--ivo);
  padding: 9px 13px;
  border-radius: 14px 14px 2px 14px;
  font-size: 12.5px;
  line-height: 1.4;
  box-shadow: 0 4px 12px rgba(48, 37, 31, 0.15);
}
.c-msg.bot {
  align-self: flex-start;
  background: rgba(255, 255, 255, 0.85);
  color: var(--esp);
  padding: 11px 14px;
  border-radius: 14px 14px 14px 2px;
  border: 1px solid rgba(168, 111, 69, 0.22);
  font-size: 12.5px;
  line-height: 1.5;
  box-shadow: 0 4px 14px rgba(48, 37, 31, 0.06);
}

/* How AI Thinks (Reasoning Accordion) */
.c-thought {
  margin-top: 8px;
  border: 1px solid rgba(168, 111, 69, 0.25);
  border-radius: 8px;
  background: rgba(242, 233, 218, 0.45);
  overflow: hidden;
  font-size: 11px;
}
.c-thought-toggle {
  width: 100%;
  text-align: left;
  padding: 6px 9px;
  background: rgba(220, 202, 176, 0.3);
  border: none;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--cop);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.c-thought-body {
  padding: 8px 10px;
  display: none;
  font-family: var(--sans);
  color: var(--char);
  line-height: 1.45;
  border-top: 1px dashed rgba(168, 111, 69, 0.2);
}
.c-thought.open .c-thought-body {
  display: block;
}
.c-thought-step {
  margin-bottom: 5px;
  padding-left: 10px;
  border-left: 2px solid var(--terra);
}
.c-thought-step b {
  font-family: var(--mono);
  color: var(--esp);
  font-size: 10.5px;
  display: block;
}

/* Action Execution Card */
.c-action-card {
  margin-top: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(185, 109, 80, 0.1);
  border: 1px solid rgba(185, 109, 80, 0.35);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.c-action-card .c-action-info {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--terra);
  font-weight: 600;
}
.c-action-card button.c-exec-btn {
  background: var(--terra);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 5px 11px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 6px rgba(185, 109, 80, 0.35);
  white-space: nowrap;
}
.c-action-card button.c-exec-btn:hover {
  background: var(--esp);
}
.c-action-card.executed {
  background: rgba(123, 128, 98, 0.15);
  border-color: rgba(123, 128, 98, 0.4);
}
.c-action-card.executed .c-action-info {
  color: var(--olive);
}

/* Chips tray */
.c-chips {
  padding: 6px 14px;
  display: flex;
  gap: 5px;
  overflow-x: auto;
  border-top: 1px solid rgba(168, 111, 69, 0.12);
  background: rgba(242, 233, 218, 0.4);
}
.c-chips::-webkit-scrollbar { height: 3px; }
.c-chips button {
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(168, 111, 69, 0.3);
  border-radius: 999px;
  padding: 3px 9px;
  font-size: 10.5px;
  color: var(--char);
  cursor: pointer;
  transition: all 0.2s;
}
.c-chips button:hover {
  background: var(--terra);
  color: #fff;
  border-color: var(--terra);
}

/* Input Tray */
.c-input-tray {
  padding: 10px 14px;
  border-top: 1px solid rgba(168, 111, 69, 0.2);
  display: flex;
  gap: 8px;
  align-items: center;
  background: rgba(248, 243, 233, 0.95);
}
.c-input-tray input {
  flex: 1;
  min-width: 0;
  border: 1px solid rgba(168, 111, 69, 0.3);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.9);
  padding: 8px 12px;
  font-size: 12px;
  font-family: inherit;
  color: var(--esp);
  outline: none;
}
.c-input-tray input:focus {
  border-color: var(--terra);
  box-shadow: 0 0 0 2px rgba(185, 109, 80, 0.2);
}
.c-input-tray .c-send-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: none;
  background: var(--terra);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.c-input-tray .c-send-btn:hover {
  background: var(--esp);
}
</style>

    </div>
  </div>
  <div class="graph-container" id="g-canvas-wrap">
    <div class="graph-hud mono">DRAG TO ORBIT • SCROLL TO ZOOM • CLICK NODE TO INSPECT</div>
    <div class="graph-legend">
      <div style="font-weight:600;margin-bottom:2px;font-family:var(--serif);font-size:13px">Entity Types</div>
      <div class="graph-legend-item"><span class="graph-legend-dot" style="background:#B96D50"></span>Persons of Interest</div>
      <div class="graph-legend-item"><span class="graph-legend-dot" style="background:#C69A55"></span>Investigation Cases</div>
      <div class="graph-legend-item"><span class="graph-legend-dot" style="background:#A86F45"></span>Bank Accounts</div>
      <div class="graph-legend-item"><span class="graph-legend-dot" style="background:#7B8062"></span>Devices / IMEI</div>
      <div class="graph-legend-item"><span class="graph-legend-dot" style="background:#8C7853"></span>Known Locations</div>
    </div>
    <div class="graph-card" id="g-card" style="display:none"></div>
  </div>`;

  const container = $("#g-canvas-wrap", el);
  const card = $("#g-card", el);

  // no WebGL (no GPU, virtual machine, remote desktop, policy) → the same graph in 2D
  const hasGL = !window.__krNoWebGL && (() => { try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (e) { return false; } })();
  if (!hasGL && window.graph2D) { window.__krNoWebGL = true; return window.graph2D(el, container, card, focusId); }
  if (!window.THREE) {
    graphV._wait = (graphV._wait || 0) + 1;
    if (graphV._wait > 8 && window.graph2D) return window.graph2D(el, container, card, focusId);
    container.innerHTML = `<div style="padding:40px;text-align:center"><h3 style="font-family:var(--serif);font-size:24px">Three.js Loading...</h3><p class="mono">Initializing 3D WebGL renderer</p></div>`;
    setTimeout(() => { if (/^#graph/.test(location.hash) && el.isConnected) route(); }, 700);
    return;
  }
  graphV._wait = 0;

  const THREE = window.THREE;
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || (window.innerHeight - 120);

  // Scene & Camera
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xF5EFEB);
  scene.fog = new THREE.FogExp2(0xF5EFEB, 0.0018);

  const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 1000);
  camera.position.set(0, 45, 310);

  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
  catch (e) { window.__krNoWebGL = true; if (window.graph2D) return window.graph2D(el, container, card, focusId); throw e; }
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  container.appendChild(renderer.domElement);

  // Lighting
  const ambient = new THREE.AmbientLight(0xfff5ea, 1.4);
  scene.add(ambient);

  const dLight1 = new THREE.DirectionalLight(0xffecd2, 1.2);
  dLight1.position.set(100, 150, 100);
  scene.add(dLight1);

  const dLight2 = new THREE.DirectionalLight(0xd9b790, 0.8);
  dLight2.position.set(-100, -100, -50);
  scene.add(dLight2);

  const graphGroup = new THREE.Group();
  scene.add(graphGroup);

  const nodeMeshes = {};
  const nodeCoords = {};

  // Compute deterministic coordinates
  GRAPH_NODES.forEach((node, i) => {
    const radius = node.type === 'CASE' ? 120 : node.type === 'PERSON' ? 68 : 160;
    const angle = (i / GRAPH_NODES.length) * Math.PI * 2;
    const elevation = ((i % 5) - 2) * 35;
    const x = Math.cos(angle) * radius + (Math.sin(i * 1.5) * 14);
    const y = elevation;
    const z = Math.sin(angle) * radius;
    nodeCoords[node.id] = { x, y, z };

    const size = node.val ? Math.max(4, node.val * 0.85) : 6;
    const geom = new THREE.SphereGeometry(size, 24, 24);
    const mat = new THREE.MeshStandardMaterial({
      color: node.color,
      roughness: 0.35,
      metalness: 0.25
    });

    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(x, y, z);
    mesh.userData = { node, origColor: node.color, size };
    graphGroup.add(mesh);
    nodeMeshes[node.id] = mesh;

    // Glowing halo ring around key entities
    if (node.id === 'P-0427' || node.id === 'CASE-014' || node.id === 'CASE-001') {
      const ringGeom = new THREE.RingGeometry(size * 1.35, size * 1.6, 32);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xC69A55,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.65
      });
      const ring = new THREE.Mesh(ringGeom, ringMat);
      ring.rotation.x = Math.PI / 2;
      mesh.add(ring);
    }
  });

  // Render Edges
  const edgeLines = [];
  const edgeColors = {
    FIR: 0xC0504A,
    FINANCIAL: 0xB96D50,
    COMMUNICATION: 0x4A7FB5,
    LOCATION: 0x7B8062,
    CROSS: 0x8A63B0
  };

  GRAPH_EDGES.forEach(edge => {
    const src = nodeCoords[edge.source];
    const tgt = nodeCoords[edge.target];
    if (!src || !tgt) return;

    const points = [
      new THREE.Vector3(src.x, src.y, src.z),
      new THREE.Vector3((src.x + tgt.x) / 2, (src.y + tgt.y) / 2 + 10, (src.z + tgt.z) / 2),
      new THREE.Vector3(tgt.x, tgt.y, tgt.z)
    ];
    const curve = new THREE.CatmullRomCurve3(points);
    const geom = new THREE.BufferGeometry().setFromPoints(curve.getPoints(20));
    const mat = new THREE.LineBasicMaterial({
      color: edgeColors[edge.modality] || 0xC69A55,
      transparent: true,
      opacity: edge.isAnomaly ? 0.85 : 0.45,
      linewidth: edge.weight || 1
    });

    const line = new THREE.Line(geom, mat);
    line.userData = { edge, origOpacity: mat.opacity };
    graphGroup.add(line);
    edgeLines.push(line);
  });

  // Mouse Interaction (Orbit, Raycasting)
  let isDragging = false;
  let prevMouseX = 0, prevMouseY = 0;
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2(-999, -999);

  const onMouseDown = e => {
    isDragging = true;
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
  };

  const onMouseMove = e => {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    if (isDragging) {
      const dx = e.clientX - prevMouseX;
      const dy = e.clientY - prevMouseY;
      graphGroup.rotation.y += dx * 0.005;
      graphGroup.rotation.x += dy * 0.005;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    }
  };

  const onMouseUp = () => { isDragging = false; };

  const onWheel = e => {
    e.preventDefault();
    camera.position.z = Math.max(120, Math.min(550, camera.position.z + e.deltaY * 0.25));
  };

  renderer.domElement.addEventListener('mousedown', onMouseDown);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  renderer.domElement.addEventListener('wheel', onWheel, { passive: false });

  // Node Click Selection
  function selectNode(node) {
    selectedNode = node;
    const mesh = nodeMeshes[node.id];

    // Highlight node & connected edges
    Object.values(nodeMeshes).forEach(m => {
      m.material.opacity = 0.35;
      m.material.transparent = true;
    });
    if (mesh) {
      mesh.material.opacity = 1;
      mesh.material.transparent = false;
    }

    const connectedNodeIds = new Set([node.id]);
    edgeLines.forEach(l => {
      const e = l.userData.edge;
      if (e.source === node.id || e.target === node.id) {
        l.material.opacity = 1;
        connectedNodeIds.add(e.source);
        connectedNodeIds.add(e.target);
      } else {
        l.material.opacity = 0.1;
      }
    });

    connectedNodeIds.forEach(id => {
      if (nodeMeshes[id]) {
        nodeMeshes[id].material.opacity = 1;
        nodeMeshes[id].material.transparent = false;
      }
    });

    // Populate Card
    card.style.display = 'block';
    card.innerHTML = `<button onclick="document.getElementById('g-card').style.display='none'" style="float:right;border:none;background:none;cursor:pointer;font-size:16px">✕</button>
      <span class="badge mono" style="background:#B96D50;color:#fff">${node.type}</span>
      <h3>${node.label}</h3>
      <div class="mono" style="opacity:.8;margin-bottom:8px">${node.sublabel}</div>
      <p style="font-size:12px;margin:6px 0">${node.type==='PERSON'?((window.KR&&KR.live)?'Recorded entity in the investigation network. Connections are recorded links, not evidence of involvement.':'Classified in criminal syndicate topology.'):node.type==='CASE'?'Consolidated master case docket with multi-modal evidence streams.':'Associated operational entity recorded in master event logs.'}</p>
      <div style="margin-top:12px;display:flex;gap:6px">
        ${node.type==='PERSON'?`<button class="go" style="margin:0;padding:6px 12px;font-size:11px" onclick="location.hash='#p/${node.id}'">Open Person Dossier →</button>`:''}
        ${node.type==='CASE'?`<button class="go" style="margin:0;padding:6px 12px;font-size:11px" onclick="location.hash='#dash'">View in Investigations →</button>`:''}
        <button onclick="document.getElementById('g-card').style.display='none'" style="border:1px solid var(--cop);background:none;padding:6px 12px;border-radius:8px;font-size:11px">Dismiss</button>
      </div>`;
  }

  const onClick = () => {
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(Object.values(nodeMeshes));
    if (intersects.length > 0) {
      const node = intersects[0].object.userData.node;
      selectNode(node);
    }
  };
  renderer.domElement.addEventListener('click', onClick);

  // Filter Buttons
  $$(".graph-controls button[data-f]", el).forEach(btn => {
    btn.onclick = () => {
      $$(".graph-controls button[data-f]", el).forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      curFilter = btn.dataset.f;

      Object.values(nodeMeshes).forEach(mesh => {
        const n = mesh.userData.node;
        const visible = curFilter === 'ALL' || n.type === curFilter;
        mesh.visible = visible;
      });

      edgeLines.forEach(line => {
        const e = line.userData.edge;
        const srcMesh = nodeMeshes[e.source];
        const tgtMesh = nodeMeshes[e.target];
        line.visible = (srcMesh && srcMesh.visible) && (tgtMesh && tgtMesh.visible);
      });
    };
  });

  // Search Input
  $("#g-search", el).oninput = e => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) {
      Object.values(nodeMeshes).forEach(m => { m.material.opacity = 1; m.material.transparent = false; });
      edgeLines.forEach(l => l.material.opacity = l.userData.origOpacity);
      return;
    }
    let match = null;
    Object.values(nodeMeshes).forEach(m => {
      const n = m.userData.node;
      const hit = n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q) || n.sublabel.toLowerCase().includes(q);
      m.material.opacity = hit ? 1 : 0.2;
      m.material.transparent = !hit;
      if (hit && !match) match = n;
    });
    if (match) selectNode(match);
  };

  // Orbit & Reset Controls
  $("#g-orbit", el).onclick = e => {
    autoOrbit = !autoOrbit;
    e.target.textContent = autoOrbit ? '⏸ Auto-Orbit' : '▶ Auto-Orbit';
    e.target.classList.toggle('on', autoOrbit);
  };

  $("#g-reset", el).onclick = () => {
    graphGroup.rotation.set(0, 0, 0);
    camera.position.set(0, 45, 310);
    Object.values(nodeMeshes).forEach(m => { m.material.opacity = 1; m.material.transparent = false; m.visible = true; });
    edgeLines.forEach(l => { l.material.opacity = l.userData.origOpacity; l.visible = true; });
    card.style.display = 'none';
  };

  // Focus initial node if provided
  if (focusId && nodeMeshes[focusId]) {
    setTimeout(() => selectNode(nodeMeshes[focusId].userData.node), 200);
  }

  // Animation Loop
  const animate = () => {
    reqId = requestAnimationFrame(animate);
    if (autoOrbit && !isDragging) {
      graphGroup.rotation.y += 0.0022;
    }
    renderer.render(scene, camera);
  };
  animate();

  // Cleanup on route departure
  window.cleanup = () => {
    cancelAnimationFrame(reqId);
    renderer.dispose();
    renderer.domElement.removeEventListener('mousedown', onMouseDown);
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
    renderer.domElement.removeEventListener('wheel', onWheel);
    renderer.domElement.removeEventListener('click', onClick);
  };
}

      answerText = `<b>ક્રોનોસ માસ્ટર ઇન્ટેલિજન્સ — જાફર સાદિક તપાસ (KRONOS-2024-001):</b><br>
સિસ્ટમ 50.070 કિગ્રા સ્યુડોએફેડ્રિન જપ્તી, ₹55.30 કરોડની PMLA મિલકત અટેચમેન્ટ, 2015/2019 પ્રિડિકેટ કસ્ટમ્સ કેસો, અને મદ્રાસ હાઈકોર્ટ/સુપ્રીમ કોર્ટ જામીન ઘટનાક્રમને ટ્રેક કરે છે.<br>
તમે 'જાફર સાદિક કાર્ટેલ સારાંશ', '50kg જપ્તી', '55 કરોડ અટેચ પ્રોપર્ટી', 'જામીન સ્થિતિ', 'Next Best Evidence લીડ્સ', અથવા '3D ગ્રાફ' વિશે પૂછી શકો છો.`;
    } else {
      reasoning = [
        "Scope: Featured Case KRONOS-2024-001 (Jaffer Sadiq Cartel Investigation).",
        "Tracking: 50.070 kg pseudoephedrine seizure, ₹55.30 Cr asset attachment, and predicate dockets."
      ];
      answerText = `<b>KRONOS Master Intelligence — Jaffer Sadiq Investigation (KRONOS-2024-001):</b><br>
Tracking the complete investigative trajectory: 50.070 kg pseudoephedrine seizure (Basai Darapur, Feb 2024), ED PMLA asset attachment of ₹55.30 crore (Sept 2024), prosecution complaint against 20 accused (Nov 2024), earlier predicate customs dockets (2015 & 2019), and Madras High Court / Supreme Court bail decisions.<br>
You can ask about "Summarise Jaffer Sadiq drug cartel investigation", "50kg seizure", "₹55.30 Cr attached assets", "predicate cases", "bail decisions", or "open 3D graph".`;
    }

    action = {
      type: "NAV",
      target: "case/KRONOS-2024-001",
      label: lang === "hi" ? "केस वर्कस्पेस खोलें" : lang === "gu" ? "કેસ વર્કસ્પેસ ખોલો" : "Open Investigation Workspace"
    };
    return { answerText, reasoning, action, executed: false };
  }

  function renderCopilotStream(){
    const stream = $("#c-stream");
    if (!stream) return;
    const l = UI[cLang] || UI.en;

    stream.innerHTML = cHist.map((m, idx) => {
      if (m.role === "user") {
        return `<div class="c-msg user">${m.text}</div>`;
      }

      const thoughtHtml = m.reasoning && m.reasoning.length ? `
        <div class="c-thought" id="cth-${idx}">
          <button class="c-thought-toggle" onclick="document.getElementById('cth-${idx}').classList.toggle('open')">
            <span>${l.thinking} (${m.reasoning.length} steps)</span>
            <span>▾</span>
          </button>
          <div class="c-thought-body">
            ${m.reasoning.map((r, i) => `<div class="c-thought-step"><b>${l.stepPrefix || "Step"} ${i+1}:</b> ${r}</div>`).join("")}
          </div>
        </div>
      ` : "";

      const actionHtml = m.action ? `
        <div class="c-action-card ${m.executed ? 'executed' : ''}">
          <div class="c-action-info">${m.executed ? l.actionDone : l.actionReady} ${m.action.label}</div>
          ${!m.executed ? `<button class="c-exec-btn" onclick="window._krExec(${idx})">${l.execBtn} →</button>` : ''}
        </div>
      ` : "";

      return `
        <div class="c-msg bot">
          <div class="c-msg-content">${m.text}</div>
          ${thoughtHtml}
          ${actionHtml}
        </div>
      `;
    }).join("");

    stream.scrollTop = stream.scrollHeight;
  }

  function renderCopilotUI(){
    cLang = localStorage.getItem("kr_copilot_lang") || cLang;
    const l = UI[cLang] || UI.en;
    $("#c-ui-title").textContent = l.title;
    $("#c-ui-live").textContent = l.live;
    $("#c-input").placeholder = l.placeholder;
    $("#c-clear-btn").textContent = `✕ ${l.clear}`;

    // Language pills active state
    $$(".c-lang-btn").forEach(b => {
    b.classList.toggle("on", b.dataset.l === cLang);
    b.setAttribute("aria-pressed", String(b.dataset.l === cLang));
    b.onclick = () => {
      cLang = b.dataset.l;
      localStorage.setItem("kr_copilot_lang", cLang);
      
      // Auto re-generate last bot response in the new language if query exists
      for (let i = cHist.length - 1; i >= 0; i--) {
        if (cHist[i].role === "user") {
          const reQ = cHist[i].text;
          const res = processCopilotQuery(reQ, cLang);
          if (res) {
            cHist[cHist.length - 1] = {
              role: "bot",
              text: res.answerText,
              reasoning: res.reasoning,
              action: res.action,
              executed: res.executed
            };
          }
          break;
        }
      }
      renderCopilotUI();
      updateContextBanner();
    };
  });

    // Suggested Chips
    const chipsEl = $("#c-chips");
    const chipList = (window.KR && KR.live && KR.chips) ? KR.chips(cLang) : l.chips;
    chipsEl.innerHTML = chipList.map(chip => `<button type="button">${chip}</button>`).join("");
    $$("#c-chips button").forEach(b => {
      b.onclick = () => askCopilot(b.textContent);
    });

    renderCopilotStream();
  }

  (window._krSend = window._krSend || {}).copilot = t => askCopilot(t);
  function askCopilot(text){
    text = (text || "").trim();
    if (!text) return;

    cHist.push({ role: "user", text: text.replace(/</g, "&lt;") });
    renderCopilotStream();
    $("#c-input").value = "";

    // "add a new case" (and every answer while a case intake is in progress) goes to the guided intake
    if (window.KRintake && KRintake.wants("copilot", text)) {
      cHist.push({ role: "bot", text: "…", reasoning: [] });
      const at = cHist.length - 1;
      renderCopilotStream();
      KRintake.chat("copilot", text, html => {
        cHist[at] = { role: "bot", text: html, reasoning: [] };
        localStorage.setItem("kr_copilot_hist", JSON.stringify(cHist.slice(-25)));
        renderCopilotStream();
      });
      return;
    }

    // Navigation commands ("open investigations", "open timeline", "open CASE005", "डैशबोर्ड खोलो", …) are executed
    // directly — in both live and offline mode — and every resolution step is reported.
    const cmd = window.KRcmd && KRcmd.parse(text);
    if (cmd) {
      const res = KRcmd.run(cmd, cLang);
      cHist.push({ role: "bot", text: res.answerText, reasoning: res.reasoning, action: res.action, executed: res.executed });
      localStorage.setItem("kr_copilot_hist", JSON.stringify(cHist.slice(-25)));
      renderCopilotStream();
      return;
    }

    // Show AI thinking indicator
    cHist.push({ role: "bot", text: "…", reasoning: [] });
    renderCopilotStream();

    if (window.KR && KR.live) {
      const hm = location.hash.match(/#(p|case)\/([A-Za-z0-9-]+)/);
      KR.ask(text, { mode: /hypothes|detect|contradict|lead|next|suspicious|pattern|why|priority/i.test(text) ? "D" : "A",
                     history: KR.toHistory(cHist.slice(0, -2)), lang: cLang,
                               personId: hm && hm[1] === "p" ? hm[2] : null, caseId: hm && hm[1] === "case" ? hm[2] : null })
        .then(r => { cHist[cHist.length - 1] = { role: "bot", text: r.html, reasoning: r.reasoning }; })
        .catch(() => { cHist[cHist.length - 1] = { role: "bot", text: "KRONOS backend did not respond. Please retry.", reasoning: [] }; })
        .finally(() => { localStorage.setItem("kr_copilot_hist", JSON.stringify(cHist.slice(-25))); renderCopilotStream(); });
      return;
    }
    setTimeout(() => {
      try {
        const res = processCopilotQuery(text, cLang);
        cHist[cHist.length - 1] = {
          role: "bot",
          text: res.answerText,
          reasoning: res.reasoning,
          action: res.action,
          executed: res.executed
        };
      } catch(err) {
        cHist[cHist.length - 1] = {
          role: "bot",
          text: "Encountered an issue processing that forensic query. Please rephrase.",
          reasoning: [err.message]
        };
      }
      localStorage.setItem("kr_copilot_hist", JSON.stringify(cHist.slice(-25)));
      renderCopilotStream();
    }, 450);
  }

  window._krExec = (idx) => {
    const m = cHist[idx];
    if (!m || !m.action) return;
    if (window.KRcmd) KRcmd.go(m.action.target, m.action.tab);
    else { location.hash = m.action.target; $("#copilot-panel").classList.remove("open"); }
    m.executed = true;
    localStorage.setItem("kr_copilot_hist", JSON.stringify(cHist.slice(-25)));
    renderCopilotStream();
    toast(`${(UI[cLang] || UI.en).actionDone} ${m.action.label}`);
  };
  // when the live backend connects: live welcome + live suggestion chips
  window._krCopilotRefresh = () => {
    if (cHist.length <= 1 && (!cHist[0] || /Featured Investigation/.test(cHist[0].text || ""))) {
      cHist = [{ role: "bot", text: KR.welcome(), reasoning: ["Connected to the KRONOS backend (local LLM, evidence ledger, analytics engines)",
                                                             "Commands are executed directly; questions are answered from cited evidence"] }];
    }
    renderCopilotUI();
    updateContextBanner();
  };

  window._krLangChanged = () => { renderCopilotUI(); updateContextBanner(); };

  // Event Listeners
  $("#copilot-btn").onclick = () => {
    $("#copilot-panel").classList.toggle("open");
    updateContextBanner();
  };
  $("#c-close-btn").onclick = () => $("#copilot-panel").classList.remove("open");
  $("#c-max-btn").onclick = () => $("#copilot-panel").classList.toggle("maximized");
  $("#c-clear-btn").onclick = () => {
    cHist = [];
    localStorage.removeItem("kr_copilot_hist");
    renderCopilotStream();
  };

  $("#c-send-btn").onclick = () => askCopilot($("#c-input").value);
  $("#c-input").onkeydown = (e) => {
    if (e.key === "Enter") askCopilot($("#c-input").value);
  };

  // Keyboard shortcut: Cmd+K / Ctrl+K
  window.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      $("#copilot-panel").classList.toggle("open");
      if ($("#copilot-panel").classList.contains("open")) {
        $("#c-input").focus();
        updateContextBanner();
      }
    }
  });

  // Language buttons
  $$(".c-lang-btn").forEach(b => {
    b.onclick = () => {
      cLang = b.dataset.l;
      localStorage.setItem("kr_copilot_lang", cLang);
      renderCopilotUI();
    };
  });

  // Initial welcome message if empty
  if (cHist.length === 0) {
    cHist.push({
      role: "bot",
      text: "<b>Welcome to KRONOS Copilot.</b><br>Featured Investigation: <b>KRONOS-2024-001 (Jaffer Sadiq Cartel Investigation)</b>.<br>I am ready to assist with multi-agency narcotics and money-laundering analysis, predicate customs cases (2015/2019), asset attachments (₹55.30 Cr), or forensic anomaly scans. You can speak to me in English, Hindi, or Gujarati, or click suggestion chips below.",
      reasoning: [
        "System Initialized with 100 Consolidated Master Dockets",
        "Multi-lingual NLP Engine Active (EN, HI, GU)",
        "Haversine & Temporal Engine Connected"
      ]
    });
  }

  renderCopilotUI();
  updateContextBanner();
})();

</script>
